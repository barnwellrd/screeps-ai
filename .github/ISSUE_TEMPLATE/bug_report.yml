name: Bug report
description: Report a reproducible problem with the Screeps bot or scaffold.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this issue. Please include the smallest reproduction and expected behavior.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: Short description of the bug
      placeholder: e.g. Harvesters stop moving after spawn queue changes
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the bot
        2. Trigger X
        3. Observe Y
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste console output, screenshots, or other evidence.

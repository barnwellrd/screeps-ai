name: Build and Deploy to Screeps (token)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          # Avoid native builds from dev deps; install minimal build tools instead.
          npm ci --omit=dev || true
          npm i --no-save typescript@^4.9.0 @types/screeps@^3.4.0 screeps@4.2.21
      - name: Build
        run: npm run build
      - name: Deploy to Screeps
        env:
          SCREEPS_TOKEN: ${{ secrets.SCREEPS_TOKEN }}
        run: |
          cat > screeps.json <<EOF
          {
            "token": "${SCREEPS_TOKEN}",
            "branch": "default",
            "path": "dist"
          }
          EOF
          set -x
          node scripts/upload-screeps.js
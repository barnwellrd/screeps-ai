name: Apply Screeps Feedback

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Approved feedback issue number containing unified diff patches
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply-feedback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect approved patches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect-approved-feedback-patches.mjs "${{ inputs.issue_number }}"
      - name: Apply approved patches
        run: |
          git apply --check approved-feedback.patch
          git apply approved-feedback.patch
      - name: Install dependencies
        run: npm install
      - name: Validate changes
        run: npm run build
      - name: Create remediation branch
        id: branch
        run: |
          BRANCH="screeps-feedback/${{ inputs.issue_number }}-${{ github.run_id }}"
          git switch -c "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Commit and push validated remediation
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add src config README.md
          git commit -m "Apply approved Screeps feedback #${{ inputs.issue_number }}"
          git push origin "${{ steps.branch.outputs.name }}"
      - name: Create and merge remediation pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_BRANCH="$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)"
          PR_URL="$(gh pr create \
            --base "$BASE_BRANCH" \
            --head "${{ steps.branch.outputs.name }}" \
            --title "Apply approved Screeps feedback #${{ inputs.issue_number }}" \
            --body "Applies the approved unified-diff feedback from #${{ inputs.issue_number }} after \`npm run build\` validation.")"
          gh pr merge "$PR_URL" --merge --delete-branch
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
      - name: Record completed remediation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ inputs.issue_number }}" \
            --body "Applied approved feedback, validated it with \`npm run build\`, and merged ${{ steps.pull-request.outputs.url }}."

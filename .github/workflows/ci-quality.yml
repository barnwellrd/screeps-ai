name: CI Quality

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Validate deployment metadata
        run: |
          node -e "const fs=require('fs'); const config=JSON.parse(fs.readFileSync('screeps.json', 'utf8')); if (!config || typeof config.branch !== 'string') { throw new Error('screeps.json is missing a valid branch'); } if (!config.path) { throw new Error('screeps.json is missing a deploy path'); } console.log('Deployment config looks valid');"
